<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/new_password.css') }}">
<title>New Password - EduPilot</title>

</head>

<body>

<div class="container">

    <h2>Create New Password</h2>

    <p class="description">
        Enter your new EduPilot password and confirm it below.
    </p>

    <form id="newPasswordForm">

        <div class="input-group">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required>

            <p class="password-info">
                Password must be at least 8 characters long.
            </p>

        </div>

        <div class="input-group">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required>

        </div>

        <button
            type="submit"
            class="change-button"
            id="changeButton">

            Change Password

        </button>

    </form>

    <p id="message" class="message"></p>

    <div class="back-login">
        <a href="/login">← Back to Login</a>
    </div>

</div>

<script src="{{ url_for('static', filename='js/new_password.js') }}"></script>

</body>
</html>
