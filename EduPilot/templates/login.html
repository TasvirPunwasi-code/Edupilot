<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
<title>EduPilot Login</title>

</head>

<body>
 <video autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='css/images/Wave.mp4') }}" type="video/mp4">
    </video>
<div class="login-container">

    <h2>EduPilot Login</h2>

    <p class="subtitle">
        Sign in to continue to EduPilot
    </p>

    <form id="loginForm">

        <div class="input-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                autocomplete="email"
                required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>
        </div>

        <button type="submit" class="login-button">
            Login
        </button>

    </form>

    <p id="message" class="message"></p>

    <div class="change-password">

        <button type="button" onclick="openPasswordModal()">
            Change Password
        </button>

    </div>

    <div class="links">

        <a href="/about">
            About Us
        </a>

        <a href="/support">
            Support
        </a>

    </div>

</div>

<div class="quote-container">
    <p id="quote" class="quote"></p>
    <span id="quote-author" class="quote-author"></span>

</div>


<!-- =========================================================
     CHANGE PASSWORD POPUP
========================================================= -->

<div class="modal-overlay" id="passwordModal">

    <div class="modal">

        <h2>Change Password</h2>

        <p class="modal-description">
            Enter your EduPilot email address. A verification code will be sent to your email before you can change your password.
        </p>

        <form id="changePasswordForm">

            <div class="input-group">

                <label for="changeEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="changeEmail"
                    placeholder="Enter your account email"
                    autocomplete="email"
                    required>

            </div>

            <p id="changePasswordMessage" class="message"></p>

            <div class="modal-buttons">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="closePasswordModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="continue-button">
                    Continue
                </button>

            </div>

        </form>

    </div>

</div>


<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
