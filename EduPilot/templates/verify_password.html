<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/verify_password.css') }}">
<title>Verify Password Change - EduPilot</title>

</head>

<body>

<div class="container">

    <h2>Verify Password Change</h2>

    <p class="description">
        Enter the 6-digit verification code sent to your email.
    </p>

    <input
        type="text"
        id="otp"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="000000">

    <button
        type="button"
        class="verify-button"
        onclick="verifyPasswordOTP()">
        Verify OTP
    </button>

    <button
        type="button"
        class="resend-button"
        onclick="resendPasswordOTP()">
        Resend OTP
    </button>

    <p id="message"></p>

    <div class="back-login">
        <a href="/login">← Back to Login</a>
    </div>

</div>

<script src="{{ url_for('static', filename='js/verify_password.js') }}"></script>

</body>
</html>
